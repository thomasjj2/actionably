h2{font-size:24px;font-weight:800;margin-bottom:4px}
h3{font-size:18px;font-weight:600}
main{flex:1;padding:8px 20px 96px;overflow-x:hidden}
p{margin:0}.mute{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:14px;padding:12px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;padding:12px 0 10px;font-size:13px;font-weight:500;color:var(--mute)}
nav button[aria-current=true]{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--line);color:var(--ink)}
.tag.Mindset{background:var(--sun);color:#3b2a00}
.warn{color:var(--bad);font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-weight:700}
.chip[aria-pressed=true]{border-color:var(--pri);background:var(--pri);color:var(--onpri)}
.stack{position:relative;height:340px;margin-top:14px;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(40,30,120,.12);user-select:none;touch-action:none}
.card.back{transform:scale(.95) translateY(14px);opacity:.7}
.card .big{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.card .stampL,.card .stampR{position:absolute;top:18px;font-weight:800;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;transform:rotate(-8deg)}
.card .stampL{left:18px;color:var(--bad)}.card .stampR{right:18px;color:var(--ok);transform:rotate(8deg)}
.acts{display:flex;gap:10px;justify-content:center;margin-top:18px}
.acts .btn{flex:1}
.done .stamp{background:var(--ok);color:#fff;border-color:var(--ok)}
.stamp{border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:12px;padding:8px 14px;font-weight:800;white-space:nowrap}
.stamp.on{background:var(--ok);border-color:var(--ok);color:#fff;animation:st .35s}
@keyframes st{0%{transform:scale(1.5) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.stamp.on{animation:none}}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
