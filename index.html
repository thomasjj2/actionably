<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saved</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#1d1b3a;--mute:#6b6894;--line:#e3dff5;--pri:#4b3fe0;--onpri:#fff;--ok:#12906a;--sun:#f4b63f;--bad:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c3d;--ink:#eeeaff;--mute:#a29fc9;--line:#34305e;--pri:#8f86ff;--onpri:#14122b;--ok:#3fd5a3;--sun:#f4b63f;--bad:#ff9a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122b;--card:#1f1c3d;--ink:#eeeaff;--mute:#a29fc9;--line:#34305e;--pri:#8f86ff;--onpri:#14122b;--ok:#3fd5a3;--sun:#f4b63f;--bad:#ff9a6b;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 "DM Sans",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:18px 20px 6px;display:flex;align-items:center;justify-content:space-between}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:28px;font-weight:800}
h2{font-size:24px;font-weight:800;margin-bottom:4px}
h3{font-size:18px;font-weight:600}
main{flex:1;padding:8px 20px 96px;overflow-x:hidden}
p{margin:0}.mute{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:14px;padding:12px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;background:none;border:0;padding:12px 0 10px;font-size:13px;font-weight:500;color:var(--mute)}
nav button[aria-current=true]{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--line);color:var(--ink)}
.tag.Mindset{background:var(--sun);color:#3b2a00}
.warn{color:var(--bad);font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-weight:700}
.chip[aria-pressed=true]{border-color:var(--pri);background:var(--pri);color:var(--onpri)}
.stack{position:relative;height:340px;margin-top:14px;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(40,30,120,.12);user-select:none;touch-action:none}
.card.back{transform:scale(.95) translateY(14px);opacity:.7}
.card .big{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.card .stampL,.card .stampR{position:absolute;top:18px;font-weight:800;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;transform:rotate(-8deg)}
.card .stampL{left:18px;color:var(--bad)}.card .stampR{right:18px;color:var(--ok);transform:rotate(8deg)}
.acts{display:flex;gap:10px;justify-content:center;margin-top:18px}
.acts .btn{flex:1}
.done .stamp{background:var(--ok);color:#fff;border-color:var(--ok)}
.stamp{border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:12px;padding:8px 14px;font-weight:800;white-space:nowrap}
.stamp.on{background:var(--ok);border-color:var(--ok);color:#fff;animation:st .35s}
@keyframes st{0%{transform:scale(1.5) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.stamp.on{animation:none}}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.day{font-weight:800;color:var(--pri);min-width:42px}
.big-n{font-family:"Bricolage Grotesque",sans-serif;font-size:56px;font-weight:800;line-height:1}
.sheet{position:fixed;inset:0;background:rgba(10,8,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
textarea{min-height:90px}
label{font-weight:700;font-size:14px;display:block;margin-top:12px}
.gro label{display:flex;gap:10px;align-items:center;font-weight:400;font-size:16px;margin:8px 0}
.empty{text-align:center;padding:40px 10px}
</style>
</head>
<body>
<div id="app">
<header><h1>Saved</h1><div class="row"><button class="btn ghost sm" id="outBtn" hidden>Sign out</button><button class="btn sm" id="addBtn">Add a save</button></div></header>
<main id="main"></main>
<nav><div id="nav"></div></nav>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Add a save"><div>
<h2>Add a save</h2>
<p class="mute">Paste the caption or add screenshots. Add every slide of a carousel.</p>
<label for="txt">Caption or text</label><textarea id="txt"></textarea>
<label for="shots">Screenshots</label><input type="file" id="shots" accept="image/*" multiple>
<label for="lnk">Original link (optional)</label><input type="text" id="lnk" placeholder="https://">
<p class="mute" style="margin-top:10px">Demo mode: sorting here is simple keyword matching. The real app sends this to Claude.</p>
<div class="row" style="margin-top:14px"><button class="btn" id="saveIt">Save it</button><button class="btn ghost" id="cancel">Cancel</button></div>
</div></div>
<script>
/* Paste your Firebase web app config here. While it says PASTE, the app runs in local demo mode. */
var FB={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT.firebaseapp.com",projectId:"PASTE_PROJECT",appId:"PASTE_APP_ID"};
var CLOUD_ON=!/^PASTE/.test(FB.apiKey),U=null,_t=null,LOADERR=false;
var KEY='saved-demo-v1';
var SEED=[
{id:1,cat:'Mindset',title:'Repetition is the father of results',src:'@hormozi',theme:'repetition',sum:'You fail by wanting the result without the 100 reps.',act:'Pick one thing you want. Do 5 reps of it today and log them.',min:20},
{id:2,cat:'Mindset',title:'Promise late, deliver early',src:'@hormozi',theme:'business habits',sum:'A list of short business maxims: give first, test small, persist.',act:'Pick two maxims and write how you will use each this week.',min:15},
{id:3,cat:'Mindset',title:'Take another shot',src:'@hormozi',theme:'repetition',sum:'What you want sits behind asking again.',act:'Ask again on one thing someone already said no to.',min:15},
{id:4,cat:'Mindset',title:'Laws behind attraction (carousel)',src:'@investingfusions',theme:'attraction',sum:'A 12-slide carousel.',miss:'Only slide 1 of 12 captured. Add the other slides.',act:'Open the original post and add the missing slides.',min:10},
{id:5,cat:'Mindset',title:'Pleasure attracts luck',src:'@destiny__unbound',theme:'attraction',sum:'A short quote about enjoyment drawing opportunity.',act:'Schedule one thing this week only because you enjoy it.',min:10},
{id:6,cat:'Cook',title:'Sample: sheet-pan chicken and veg',src:'sample',theme:'cooking',sum:'Sample recipe to show the grocery list.',ing:['Chicken thighs','Broccoli','Olive oil','Garlic'],act:'Buy the ingredients and cook it once.',min:45},
{id:7,cat:'Train',title:'Sample: 20-minute full-body circuit',src:'sample',theme:'fitness',sum:'Sample workout.',act:'Do the circuit once, any day.',min:20}
];
var S={tab:'saves',saves:SEED.slice(),dec:{},size:4,plan:null,total:0,reps:0,groc:{}};
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.saves)S=o}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(U&&window.cloud){clearTimeout(_t);_t=setTimeout(function(){window.cloud.save(JSON.parse(JSON.stringify(S)))},800)}}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var $=function(i){return document.getElementById(i)};
var TABS=[['saves','Saves'],['review','Review'],['plan','Plan'],['progress','Progress']];
function nav(){$('nav').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" aria-current="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join('')}
function go(t){S.tab=t;save();render();window.scrollTo(0,0)}
function themeCount(){var c={};S.saves.forEach(function(s){c[s.theme]=(c[s.theme]||0)+1});return c}
function picks(){return S.saves.filter(function(s){return S.dec[s.id]==='do'})}
function queue(){return S.saves.filter(function(s){return !S.dec[s.id]||S.dec[s.id]==='later'}).sort(function(a,b){return (S.dec[a.id]==='later'?1:0)-(S.dec[b.id]==='later'?1:0)||b.id-a.id})}
function render(){nav();var m=$('main');if(CLOUD_ON&&!U){$('nav').innerHTML='';m.innerHTML=vGate();$('addBtn').hidden=true;$('outBtn').hidden=true;return}if(!S.profile){$('nav').innerHTML='';m.innerHTML=vOnb();$('addBtn').hidden=true;$('outBtn').hidden=!U;return}$('addBtn').hidden=false;$('outBtn').hidden=!U;
if(S.tab==='saves')m.innerHTML=vSaves();
else if(S.tab==='review')m.innerHTML=vReview(),bindReview();
else if(S.tab==='plan')m.innerHTML=vPlan();
else m.innerHTML=vProg()+'<p style="margin-top:16px"><button class="btn ghost sm" id="editprof">Change my focus and time</button></p>'}
function vSaves(){var tc=themeCount(),top=Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]})[0];
var h='<h2>Your saves</h2><p class="mute">'+S.saves.length+' saved. Review them each week and do a few.</p>';
if(!S.saves.length)h+='<div class="empty"><p class="mute">Nothing saved yet. Tap Add a save to start.</p></div>';if(tc[top]>=3)h+='<div class="item"><strong>Pattern:</strong> you saved '+tc[top]+' posts about '+esc(top)+'. Your plan can turn that into a rep goal.</div>';
S.saves.slice().sort(function(a,b){return b.id-a.id}).forEach(function(s){
h+='<div class="item"><div class="row sp"><span class="tag '+s.cat+'">'+s.cat+'</span><span class="mute">'+esc(s.src||'')+'</span></div><h3 style="margin-top:8px">'+esc(s.title)+'</h3><p class="mute">'+esc(s.sum)+'</p>'+(s.miss?'<p class="warn">'+esc(s.miss)+'</p>':'')+(s.link?'<p class="mute"><a href="'+esc(s.link)+'" rel="noopener" target="_blank">Original post</a></p>':'')+'</div>'});
return h}
function vReview(){var q=queue(),n=picks().length,h='<h2>Weekly review</h2><p class="mute">How many do you want to do this week?</p><div class="chips" role="group" aria-label="Plan size">'+[2,4,6].map(function(k){return '<button class="chip" data-size="'+k+'" aria-pressed="'+(S.size===k)+'">'+k+'</button>'}).join('')+'</div>';
if(n>=S.size||!q.length){return h+'<div class="empty"><h3>'+n+' picked</h3><p class="mute" style="margin:6px 0 16px">'+(n?'Ready to build your week.':'Nothing picked. Reset to review again.')+'</p>'+(n?'<button class="btn" id="build">Build my plan</button> ':'')+'<button class="btn ghost" id="resetRev">Start over</button></div>'+(n?vGoals():'')}
h+='<p class="mute">'+n+' of '+S.size+' picked. New saves come first.</p><div class="stack" id="stack">';
if(q[1])h+=card(q[1],true);h+=card(q[0],false)+'</div><div class="acts"><button class="btn ghost" data-d="drop">Drop</button><button class="btn ghost" data-d="later">Later</button><button class="btn" data-d="do">Do it</button></div>';return h}
function card(s,back){return '<div class="card'+(back?' back':'')+'" '+(back?'aria-hidden="true"':'id="top"')+'><span class="stampL">DROP</span><span class="stampR">DO IT</span><div class="row sp"><span class="tag '+s.cat+'">'+s.cat+'</span><span class="mute">'+s.min+' min</span></div><div class="big">'+esc(s.title)+'</div><p class="mute">'+esc(s.sum)+'</p><p><strong>Next step:</strong> '+esc(s.act)+'</p>'+(s.miss?'<p class="warn">'+esc(s.miss)+'</p>':'')+'</div>'}
function decide(d){var q=queue();if(!q.length)return;S.dec[q[0].id]=d;save();render()}
function bindReview(){var t=$('top');if(!t)return;var x0=null,dx=0;
t.addEventListener('pointerdown',function(e){x0=e.clientX;t.setPointerCapture(e.pointerId)});
t.addEventListener('pointermove',function(e){if(x0===null)return;dx=e.clientX-x0;t.style.transform='translateX('+dx+'px) rotate('+dx/18+'deg)';t.querySelector('.stampR').style.opacity=Math.max(0,dx/90);t.querySelector('.stampL').style.opacity=Math.max(0,-dx/90)});
t.addEventListener('pointerup',function(){if(x0===null)return;var d=dx;x0=null;dx=0;if(d>90)decide('do');else if(d<-90)decide('drop');else{t.style.transform='';t.querySelector('.stampR').style.opacity=0;t.querySelector('.stampL').style.opacity=0}})}
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],SUGG=null,OB={focus:[],hours:null,style:null};
function goalItems(){return (S.goals||[]).map(function(g,i){var d=String(g.deadline||'Fri').slice(0,3);if(DAYS.indexOf(d)<0)d='Fri';return {id:'g'+i,goal:true,t:String(g.title),metric:String(g.metric||''),step:String(g.why||''),min:+g.est_minutes||30,target:+g.target||5,cur:0,day:d,done:false}})}
function finish(it){S.history=(S.history||[]).concat((S.plan||[]).map(function(x){return {goal_title:x.t,target:x.goal?x.target:1,completed:x.goal?(x.cur||0):(x.done?1:0)}})).slice(-20);S.plan=it;S.groc={};S.goals=[];SUGG=null;save();go('plan')}
function localBuild(){var gs=goalItems(),items=[];
picks().slice(0,Math.max(1,S.size-gs.length)).forEach(function(s){items.push({id:'p'+s.id,t:s.title,step:s.act,min:s.min,ing:s.ing||null,link:s.link||null,miss:s.miss||null,done:false})});
var gap=Math.max(1,Math.floor(7/Math.max(items.length,1)));items.forEach(function(it,i){it.day=DAYS[(i*gap)%7]});finish(items.concat(gs))}
function build(){var bt=$('build');if(bt){bt.disabled=true;bt.textContent='Building your week...'}
var gs=goalItems(),pk=picks().slice(0,Math.max(1,S.size-gs.length)),gm=gs.reduce(function(a,g){return a+g.min},0),hrs=Math.max(0.5,(((S.profile&&S.profile.hours)||3)*60-gm)/60);
ai('plan',{size:pk.length,hours:hrs,picks:pk.map(function(s){return {id:s.id,category:s.cat,title:s.title,steps_or_items:s.ing||[s.act],time_needed:s.min,missing_info:s.miss||null,source_link:s.link||null}})}).then(function(r){
var by={};S.saves.forEach(function(s){by[s.id]=s});
var it=(r.plan||[]).filter(function(p){return by[p.ref]}).map(function(p){var s=by[p.ref];return {id:'p'+s.id,t:s.title,step:p.next_step,min:+p.est_minutes||s.min,day:DAYS.indexOf(p.day)>=0?p.day:'Wed',ing:s.ing||null,link:s.link||null,miss:s.miss||null,done:false}});
if(!it.length||it.length>pk.length)throw 0;finish(it.concat(gs))}).catch(localBuild)}
function vGoals(){var h='<div style="text-align:left;margin-top:20px"><h3>Goals for this week</h3>';
(S.goals||[]).forEach(function(g,i){h+='<div class="item"><strong>'+esc(g.title)+'</strong><p class="mute">'+esc(g.target)+' '+esc(g.metric)+' by '+esc(g.deadline)+'</p><button class="btn ghost sm" data-grm="'+i+'" style="margin-top:8px">Remove</button></div>'});
if(SUGG==='loading')h+='<p class="mute">Thinking about your week...</p>';
else if(SUGG==='error')h+='<p class="warn">Could not suggest goals right now. You can build your plan without them.</p>';
else if(SUGG&&SUGG.q)h+='<p class="mute">'+esc(SUGG.q)+'</p>';
else if(Array.isArray(SUGG))SUGG.forEach(function(g,i){if((S.goals||[]).some(function(x){return x.title===g.title}))return;h+='<div class="item"><strong>'+esc(g.title)+'</strong><p class="mute">'+esc(g.target)+' '+esc(g.metric)+' by '+esc(g.deadline)+', about '+esc(g.est_minutes)+' min</p><p class="mute">'+esc(g.why)+'</p><div class="row" style="margin-top:8px"><button class="btn sm" data-ga="'+i+'">Add</button><button class="btn ghost sm" data-gs="'+i+'">Skip</button></div></div>'});
if(SUGG!=='loading'&&(!Array.isArray(SUGG)||!SUGG.length))h+='<button class="btn ghost sm" id="sugg" style="margin-top:8px">Suggest goals</button>';
return h+'</div>'}
function vOnb(){var F=['Money / business','Fitness','Career','Habits and discipline','Learning','Relationships'];
function ch(on,at,v,l){return '<button class="chip" '+at+'="'+esc(v)+'" aria-pressed="'+on+'">'+esc(l)+'</button>'}
var h='<h2>Set up your week</h2><p class="mute">Three taps. You can change this later.</p><h3 style="margin-top:18px">What are you working toward?</h3><p class="mute">Pick up to 2.</p><div class="chips">';
F.forEach(function(f){h+=ch(OB.focus.indexOf(f)>=0,'data-obf',f,f)});
h+='</div><h3>How much time can you give this each week?</h3><div class="chips">';
[[1,'About 1 hour'],[3,'3 hours'],[5,'5+ hours']].forEach(function(o){h+=ch(OB.hours===o[0],'data-obh',o[0],o[1])});
h+='</div><h3>How do you like to work?</h3><div class="chips">';
[['daily','Small daily steps'],['weekly','One bigger weekly push']].forEach(function(o){h+=ch(OB.style===o[0],'data-obs',o[0],o[1])});
return h+'</div><button class="btn" id="obdone" style="margin-top:14px"'+((OB.focus.length&&OB.hours&&OB.style)?'':' disabled')+'>Start my week</button>'}
function vPlan(){if(!S.plan)return '<div class="empty"><h2>No plan yet</h2><p class="mute" style="margin:6px 0 16px">Pick saves in your weekly review first.</p><button class="btn" data-t="review">Start review</button></div>';
var h='<h2>This week</h2><p class="mute">'+S.plan.length+' items. Tap I did it when you finish one.</p>';
S.plan.forEach(function(it){h+='<div class="item"><div class="row sp"><span class="day">'+it.day+'</span><span class="mute">'+it.min+' min</span></div><h3>'+esc(it.t)+'</h3><p class="mute">'+esc(it.step)+'</p>'+(it.miss?'<p class="warn">'+esc(it.miss)+'</p>':'');
if(it.goal){var c=it.cur||0;h+='<div class="row sp" style="margin-top:10px"><span><strong>'+c+' / '+it.target+'</strong> <span class="mute">'+esc(it.metric)+'</span></span><button class="btn sm" data-rep="'+it.id+'">+1 done</button></div><div class="bar"><i style="width:'+Math.min(100,c/it.target*100)+'%"></i></div>'}
else h+='<div style="margin-top:10px"><button class="stamp'+(it.done?' on':'')+'" data-done="'+it.id+'" aria-pressed="'+it.done+'">'+(it.done?'Done':'I did it')+'</button></div>';
h+='</div>'});
var ing=[];S.plan.forEach(function(it){(it.ing||[]).forEach(function(g){if(ing.indexOf(g)<0)ing.push(g)})});
if(ing.length){h+='<div class="item gro"><h3>Grocery list</h3>';ing.forEach(function(g){h+='<label><input type="checkbox" data-g="'+esc(g)+'"'+(S.groc[g]?' checked':'')+'> '+esc(g)+'</label>'});h+='</div>'}
return h}
function isDone(it){return it.goal?(it.cur||0)>=it.target:it.done}
function vProg(){if(!S.plan)return '<div class="empty"><h2>Progress</h2><p class="mute">Build a plan to start tracking.</p></div>';
var d=S.plan.filter(isDone).length,n=S.plan.length;
return '<h2>This week</h2><div class="item"><div class="big-n">'+d+' of '+n+'</div><p class="mute">items done</p><div class="bar"><i style="width:'+(n?d/n*100:0)+'%"></i></div></div><div class="item"><div class="big-n">'+S.total+'</div><p class="mute">total completed since you started</p></div>'+(d===n&&n?'<div class="item"><strong>Week complete.</strong> Next week can be one item bigger.</div>':'<div class="item mute">Finishing at least half keeps next week the same size. Finishing under half shrinks it.</div>')}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.t)go(b.dataset.t);
else if(b.dataset.size){S.size=+b.dataset.size;save();render()}
else if(b.dataset.d)decide(b.dataset.d);
else if(b.id==='build')build();
else if(b.id==='resetRev'){S.dec={};save();render()}
else if(b.dataset.done){var it=S.plan.filter(function(x){return x.id===b.dataset.done})[0];if(it&&!it.done){it.done=true;S.total++;save();render()}}
else if(b.dataset.rep){var g=S.plan.filter(function(x){return x.id===b.dataset.rep})[0];if(g&&(g.cur||0)<g.target){g.cur=(g.cur||0)+1;if(g.cur===g.target)S.total++;save();render()}}
});
document.addEventListener('change',function(e){if(e.target.dataset&&e.target.dataset.g!==undefined){S.groc[e.target.dataset.g]=e.target.checked;save()}});
function sheet(o){$('sheet').classList.toggle('open',o)}
$('addBtn').onclick=function(){sheet(true);$('txt').focus()};$('cancel').onclick=function(){sheet(false)};
function shrink(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7).split(',')[1])};im.onerror=function(){res(null)};im.src=r.result};r.onerror=function(){res(null)};r.readAsDataURL(f)})}
function ai(mode,body){body.mode=mode;var tk=(U&&window.cloud)?window.cloud.token():Promise.resolve(null);return tk.then(function(t){var h={'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;return fetch('/api/ai',{method:'POST',headers:h,body:JSON.stringify(body)})}).then(function(r){if(!r.ok)throw new Error('ai '+r.status);return r.json()})}
function nextId(){return S.saves.length?Math.max.apply(null,S.saves.map(function(s){return s.id}))+1:1}
function addSave(o){S.saves.push(o);S.tab='saves';save();$('saveIt').disabled=false;$('saveIt').textContent='Save it';$('txt').value='';$('lnk').value='';$('shots').value='';sheet(false);render()}
function heur(t,n,l){var low=t.toLowerCase(),cat='Mindset';if(/recipe|cup|tbsp|bake|cook|ingredient/.test(low))cat='Cook';else if(/workout|reps|sets|squat|run/.test(low))cat='Train';else if(/buy|\$|deal|review/.test(low))cat='Buy';
return {id:nextId(),cat:cat,title:t?t.split(/\s+/).slice(0,8).join(' '):'Screenshot save ('+n+' image'+(n>1?'s':'')+')',src:'you',theme:cat==='Mindset'?'mindset':cat.toLowerCase(),sum:t?t.slice(0,110):'Screenshots added.',act:'Review this save and choose one concrete step.',min:15,link:/^https?:\/\//.test(l)?l:null,miss:(n===1&&!t)?'One image only. If this is a carousel, add the other slides.':null}}
$('saveIt').onclick=function(){var t=$('txt').value.trim(),fs=[].slice.call($('shots').files).slice(0,4),l=$('lnk').value.trim();if(!t&&!fs.length){$('txt').focus();return}
var btn=$('saveIt');btn.disabled=true;btn.textContent='Reading your save...';
Promise.all(fs.map(shrink)).then(function(im){im=im.filter(Boolean);
return ai('extract',{text:t,images:im}).then(function(x){var c=String(x.category||'mindset');c=c.charAt(0).toUpperCase()+c.slice(1);
addSave({id:nextId(),cat:c,title:String(x.title||'Untitled').slice(0,80),src:'you',theme:String(x.theme||c).toLowerCase(),sum:String(x.summary||''),ing:(c==='Cook'&&Array.isArray(x.steps_or_items))?x.steps_or_items.map(String):null,act:String(x.suggested_action||'Review this save and choose one step.'),min:+x.time_needed||15,link:/^https?:\/\//.test(l)?l:null,miss:x.missing_info?String(x.missing_info):null})})
.catch(function(){addSave(heur(t,fs.length,l))})})};
function vGate(){return '<div class="empty"><h2>Sign in to keep your saves</h2><p class="mute" style="margin:6px 0 16px">Your saves and weekly plans sync across your devices.</p><button class="btn" id="signin">Continue with Google</button><p class="warn" id="gerr">'+(LOADERR?'Could not load your saves. Check your Firestore rules, then try again.':'')+'</p></div>'}
window.onAuth=function(u,data,err){if(err){LOADERR=true;U=null;render();return}LOADERR=false;U=u;
if(u){if(data&&data.saves){S=data}else{S={tab:'saves',saves:[],dec:{},size:4,plan:null,total:0,reps:0,groc:{}};save()}}render()};
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!window.cloud)return;
if(b.id==='signin'){window.cloud.signIn().catch(function(){var g=$('gerr');if(g)g.textContent='Sign-in failed. Make sure this site is an authorized domain in Firebase Auth.'})}
else if(b.id==='outBtn'){try{localStorage.removeItem(KEY)}catch(x){}window.cloud.signOut()}});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
if(d.obf!==undefined){var i=OB.focus.indexOf(d.obf);if(i>=0)OB.focus.splice(i,1);else if(OB.focus.length<2)OB.focus.push(d.obf);render()}
else if(d.obh){OB.hours=+d.obh;render()}
else if(d.obs){OB.style=d.obs;render()}
else if(b.id==='obdone'){S.profile={focus:OB.focus.slice(),hours:OB.hours,style:OB.style};save();render()}
else if(b.id==='editprof'){var pr=S.profile||{};OB={focus:(pr.focus||[]).slice(),hours:pr.hours||null,style:pr.style||null};S.profile=null;render()}
else if(b.id==='sugg'){SUGG='loading';render();var tc=themeCount();
ai('goals',{profile:S.profile,themes:Object.keys(tc).map(function(k){return {theme:k,save_count:tc[k]}}),recent_saves:S.saves.slice(-10).map(function(x){return {title:x.title,theme:x.theme,suggested_action:x.act}}),history:(S.history||[]).slice(-20)})
.then(function(r){SUGG=(r.goals&&r.goals.length)?r.goals:(r.question?{q:r.question}:'error');render()}).catch(function(){SUGG='error';render()})}
else if(d.ga!==undefined){var g=Array.isArray(SUGG)&&SUGG[+d.ga];S.goals=S.goals||[];if(g&&S.goals.length<3&&!S.goals.some(function(x){return x.title===g.title})){S.goals.push(g);save()}render()}
else if(d.gs!==undefined){if(Array.isArray(SUGG))SUGG=SUGG.filter(function(x,i){return i!==+d.gs});render()}
else if(d.grm!==undefined){S.goals.splice(+d.grm,1);save();render()}});
if(CLOUD_ON){$('main').innerHTML='<p class="mute">Loading...</p>'}else render();
</script>
<script type="module">
if(window.CLOUD_ON){
const A="https://www.gstatic.com/firebasejs/10.12.2/";
const {initializeApp}=await import(A+"firebase-app.js");
const {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=await import(A+"firebase-auth.js");
const {getFirestore,doc,getDoc,setDoc}=await import(A+"firebase-firestore.js");
const app=initializeApp(window.FB),auth=getAuth(app),db=getFirestore(app);
window.cloud={
signIn:()=>signInWithPopup(auth,new GoogleAuthProvider()),
signOut:()=>signOut(auth),
token:()=>auth.currentUser?auth.currentUser.getIdToken():Promise.resolve(null),
save:(st)=>setDoc(doc(db,"savedApp",auth.currentUser.uid),{state:JSON.stringify(st),updated:Date.now()}).catch(()=>{})
};
onAuthStateChanged(auth,async(u)=>{let data=null;
if(u){try{const d=await getDoc(doc(db,"savedApp",u.uid));if(d.exists())data=JSON.parse(d.data().state)}catch(e){window.onAuth(null,null,true);return}}
window.onAuth(u,data)});
}
</script>
